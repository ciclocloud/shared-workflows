name: Reusable EKS Blue-Green Pipeline

on:
  workflow_call:
    inputs:
      aws_region:
        required: true
        type: string
      ecr_repository:
        required: true
        type: string
      cluster_name:
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: true
      AWS_ACCOUNT_ID:
        required: true

jobs:
  ci-cd-pipeline:
    name: Integración y Despliegue Blue-Green
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Instalar Dependencias
        working-directory: ./src
        run: npm ci
        
      - name: Ejecutar Pruebas Unitarias
        working-directory: ./src
        run: npm test

      - name: Configurar Credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Iniciar sesión en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir y subir imagen a ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ./src
        run: |
          docker build -t $ECR_REGISTRY/${{ inputs.ecr_repository }}:$IMAGE_TAG .
          docker push $ECR_REGISTRY/${{ inputs.ecr_repository }}:$IMAGE_TAG

      - name: Conectar al Clúster EKS
        run: aws eks update-kubeconfig --region ${{ inputs.aws_region }} --name ${{ inputs.cluster_name }}

      - name: Identificar entorno objetivo (Blue/Green)
        id: env-selector
        run: |
          # Si el servicio no existe, por defecto desplegamos blue
          CURRENT_VERSION=$(kubectl get svc techmarket-orders-svc -o jsonpath='{.spec.selector.version}' || echo "green")
          if [ "$CURRENT_VERSION" == "blue" ]; then
            echo "target_version=green" >> $GITHUB_ENV
          else
            echo "target_version=blue" >> $GITHUB_ENV
          fi

      - name: Desplegar en entorno ${{ env.target_version }}
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ inputs.aws_region }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s|REPOSITORY_URI_PLACEHOLDER:latest|$ECR_REGISTRY/${{ inputs.ecr_repository }}:$IMAGE_TAG|g" k8s/deployment-${{ env.target_version }}.yaml
          kubectl apply -f k8s/deployment-${{ env.target_version }}.yaml

      - name: Validación de salud (pre-switch, tráfico intacto)
        run: |
          set -euo pipefail
          
          # 1. Abrir un túnel. Mapeamos puerto local 8080 al puerto del servicio (80)
          # Si tu service.yaml tiene otro puerto, cambia el '80' por ese valor.
          kubectl port-forward svc/techmarket-orders-svc 8080:80 &
          PF_PID=$!
          sleep 5 
          
          echo "Validando candidato '${{ env.target_version }}' en localhost:8080/health"
          
          # 2. Bucle de validación apuntando al puerto local 8080
          SUCCESS=false
          for i in {1..6}; do
            echo "Intento $i..."
            if curl -s http://localhost:8080/health | grep -q '"status":"OK"'; then
              echo "Validación exitosa."
              SUCCESS=true
              break
            fi
            sleep 5
          done
          
          # 3. Cerrar el túnel
          kill $PF_PID || true
          
          # 4. Validar resultado
          if [ "$SUCCESS" = false ]; then
            echo "Error: El candidato '${{ env.target_version }}' no superó la validación."
            exit 1
          fi

      - name: Switch de Tráfico (Blue-Green)
        run: |
          echo "Conmutando tráfico hacia: ${{ env.target_version }}"
          kubectl patch svc techmarket-orders-svc -p '{"spec":{"selector":{"version":"${{ env.target_version }}"}}}'

      - name: Rollback automático
        if: failure()
        run: |
          echo "Reponiendo el tráfico en el color estable..."
          kubectl rollout undo deployment/techmarket-orders-${{ env.target_version }}
          echo "Rollback completado: el tráfico quedó en la última versión estable."